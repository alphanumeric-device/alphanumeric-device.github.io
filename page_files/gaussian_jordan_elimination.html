             }
             write(`Running Scalar Multiplication on ${rowArray}. Multiplying by ${scalar}`, false)

//if there is a zero below the modifying row, and is on bottom triangle, then we swap the negative for the scalars.
if(/*matrix[tRN][tRN] !== 1 && scalar1 == 1*/ scalar1 !== 0 && scalar2 !== 0){

              if(Math.sign(scalar1) == Math.sign(scalar2)){
              for(var i = 0; i < targetRow1.length; i ++){
                 //target is top. scalar is from other row. should be same and opposite
                combined.push(targetRow1[i] * -scalar2 + row2[i] * scalar1)
              }
            for(var i = 0; i < mB1.length; i ++){
                // write(`${mB1}`, true)
                mBC1.push(mB1[i] * -scalar2 + mB2[i] * scalar1)
            }
                  write(`(Due to same signs, rows require modification) Combining row: ${targetRow1} and constant row: ${mB1} with row: ${row2} and constant row: ${mB2}. Row 1 is providing the scalar: ${scalar1} and Row 2 is providing the scalar: ${-scalar2}`, false)

          }
              return [combined, mBC1]
        } else {
    write(`Failed to run Scalar Multiplication. The value of one of the provided scalars was 0`)
        return false

function runTT(){
